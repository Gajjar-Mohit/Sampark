[package]
name = "nth-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
rdkafka = "0.36.2"
tokio = {version = "1.36.0", features = ["full"]}
dotenvy = "0.15"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
once_cell = "1.21.3"
serde_json = "1.0.145"
redis = { version = "1.0.0-rc.4", features = ["tokio-comp"] }
chrono = "0.4.42"
